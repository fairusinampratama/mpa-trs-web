name: Stage 3 GitHub Pages
run-name: Stage 3 preview from ${{ github.sha }}
on:
  push:
    branches: [stage3/interactive-prototype]
    paths:
      - 'docs/stage3/prototype/**'
      - '.github/workflows/stage3-pages.yml'
permissions:
  contents: read
concurrency:
  group: stage3-github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'fairusinampratama/mpa-trs-web' && github.ref == 'refs/heads/stage3/interactive-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/stage3/prototype
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/stage3/prototype/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test public payload boundary
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build exact source revision
        run: npm run build
        env:
          PREVIEW_BASE: /mpa-trs-web/
          VITE_SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify only safe compiled frontend output
        run: python3 tools/verify_preview.py dist "$SOURCE_COMMIT"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/stage3/prototype/dist/
          retention-days: 7
  deploy:
    needs: build
    if: github.repository == 'fairusinampratama/mpa-trs-web' && github.ref == 'refs/heads/stage3/interactive-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read native Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: docs/stage3/prototype/tools
      - name: Verify published HTTPS entries, assets and source identity
        working-directory: docs/stage3/prototype
        run: python3 tools/verify_live_preview.py "$SOURCE_COMMIT" "$PAGES_URL"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
