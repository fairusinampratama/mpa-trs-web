name: Approved production release operation (manual)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Separately approved production operation
        required: true
        type: choice
        options: [stage, deploy, rollback]
      revision:
        description: Exact approved target SHA
        required: true
        type: string
      previous:
        description: Expected active SHA, or NONE for initial bootstrap
        required: true
        type: string
      source_run:
        description: Successful source run, required for deploy
        type: string
      digest:
        description: Approved inner ZIP SHA-256, required for deploy
        type: string
      approval:
        description: Only after exact production approval enter APPROVED_PRODUCTION_OPERATION
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mpa-trs-production-operation
  cancel-in-progress: false
jobs:
  operation:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'APPROVED_PRODUCTION_OPERATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require recorded private daemon proof before credentials
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          proof=json.loads(Path('docs/infrastructure/private-release-rehearsal-evidence.json').read_text())
          assert proof['success'] is True and proof['rename_over_existing_verified'] is True
          assert proof['certificate_verified'] is True and proof['production_activation'] is False
          PYCODE
      - run: python3 -m unittest discover -s tests/deployment -v
      - name: Fetch exact successful production artifact
        if: inputs.action != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REVISION: ${{ inputs.revision }}
          DIGEST: ${{ inputs.digest }}
        run: |
          python3 scripts/deployment/fetch_application_artifact.py --run "$SOURCE_RUN" --revision "$REVISION" --digest "$DIGEST" --destination incoming
      - name: Approved operation with scoped credentials
        env:
          MPA_TRS_FTPS_RUNTIME_USER: ${{ secrets.MPA_TRS_FTPS_RUNTIME_USER }}
          MPA_TRS_FTPS_RUNTIME_PASSWORD: ${{ secrets.MPA_TRS_FTPS_RUNTIME_PASSWORD }}
          MPA_TRS_FTPS_ASSETS_USER: ${{ secrets.MPA_TRS_FTPS_ASSETS_USER }}
          MPA_TRS_FTPS_ASSETS_PASSWORD: ${{ secrets.MPA_TRS_FTPS_ASSETS_PASSWORD }}
          MPA_TRS_PRODUCTION_APPROVAL: ${{ inputs.approval }}
          OPERATION: ${{ inputs.action }}
          REVISION: ${{ inputs.revision }}
          PREVIOUS: ${{ inputs.previous }}
          SOURCE_RUN: ${{ inputs.source_run }}
          DIGEST: ${{ inputs.digest }}
        run: |
          python3 scripts/deployment/production_delivery.py "$OPERATION" --revision "$REVISION" --previous "$PREVIOUS" --run-id "$GITHUB_RUN_ID" --archive "incoming/application-$REVISION.zip" --digest "$DIGEST" --source-run "$SOURCE_RUN" --report evidence/delivery.json
      - name: Verify actual HTTPS revision and assets
        if: inputs.action != 'stage'
        env:
          REVISION: ${{ inputs.revision }}
        run: python3 scripts/deployment/verify_live.py --revision "$REVISION" --ready evidence/delivery.json --report evidence/live.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: production-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          retention-days: 14
