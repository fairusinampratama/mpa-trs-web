name: Supervised ZIP release (manual approval)
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [upload, verify-extracted, activate, rollback]
        required: true
      source_run:
        description: Successful exact application artifact run
        required: true
      revision:
        description: Exact approved source Git SHA
        required: true
      digest:
        description: Approved inner ZIP SHA-256
        required: true
      previous:
        description: Expected active SHA, or NONE before initial activation
        required: true
      approval:
        description: Enter APPROVED_SUPERVISED_ZIP_OPERATION only after scoped approval
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mpa-trs-supervised-production
  cancel-in-progress: false
jobs:
  supervised:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'APPROVED_SUPERVISED_ZIP_OPERATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check deployment tooling
        run: python3 -m unittest discover -s tests/deployment -v
      - name: Fetch and verify the approved exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REVISION: ${{ inputs.revision }}
          DIGEST: ${{ inputs.digest }}
        run: python3 scripts/deployment/fetch_application_artifact.py --run "$SOURCE_RUN" --revision "$REVISION" --digest "$DIGEST" --destination incoming
      - name: Perform only the approved supervised step
        env:
          ACTION: ${{ inputs.action }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REVISION: ${{ inputs.revision }}
          DIGEST: ${{ inputs.digest }}
          PREVIOUS: ${{ inputs.previous }}
          MPA_TRS_PRODUCTION_APPROVAL: ${{ inputs.approval }}
          MPA_TRS_FTPS_RUNTIME_USER: ${{ secrets.MPA_TRS_FTPS_RUNTIME_USER }}
          MPA_TRS_FTPS_RUNTIME_PASSWORD: ${{ secrets.MPA_TRS_FTPS_RUNTIME_PASSWORD }}
        run: python3 scripts/deployment/supervised_zip.py "$ACTION" --archive "incoming/application-$REVISION.zip" --revision "$REVISION" --digest "$DIGEST" --source-run "$SOURCE_RUN" --previous "$PREVIOUS" --run-id "$GITHUB_RUN_ID" --report evidence/operation.json
      - name: Verify live revision and assets after activation
        if: inputs.action == 'activate' || inputs.action == 'rollback'
        env:
          REVISION: ${{ inputs.revision }}
        run: python3 scripts/deployment/verify_live.py --archive "incoming/application-$REVISION.zip" --revision "$REVISION" --report evidence/live.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: supervised-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/*.json
          retention-days: 14
          if-no-files-found: warn
