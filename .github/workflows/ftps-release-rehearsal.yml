name: Approved private parallel sample (manual branch only)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Approved 64-file sample only; enter PRIVATE_PARALLEL_SAMPLE
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mpa-trs-ftps-private-probe
  cancel-in-progress: false
jobs:
  sample:
    if: github.ref == 'refs/heads/stage1/private-parallel-sample' && inputs.approval == 'PRIVATE_PARALLEL_SAMPLE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/deployment -v
      - name: Fetch fixed previously verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/fetch_application_artifact.py --run 37895631691 --revision b76876e6ca5944feb2365d0347798004f658962d --digest 29a2dc8d50041ffc7601700e0a13298ab9d47d35d89ca6319f0106002b6e84fd --destination incoming
      - name: Approved 64-file sample and harmless selector cycle
        env:
          MPA_TRS_FTPS_PROBE_USER: ${{ secrets.MPA_TRS_FTPS_PROBE_USER }}
          MPA_TRS_FTPS_PROBE_PASSWORD: ${{ secrets.MPA_TRS_FTPS_PROBE_PASSWORD }}
          MPA_TRS_PRIVATE_APPROVAL: ${{ inputs.approval }}
        run: python3 scripts/deployment/ftps_parallel_sample.py --archive incoming/application-b76876e6ca5944feb2365d0347798004f658962d.zip --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --report evidence/parallel-sample.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: private-parallel-sample-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/parallel-sample.json
          retention-days: 14
