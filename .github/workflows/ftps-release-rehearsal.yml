name: Private Laravel file and selector rehearsal (manual)
on:
  workflow_dispatch:
    inputs:
      source_a:
        description: Successful source run for release A
        required: true
        type: string
      revision_a:
        description: Exact tested commit A
        required: true
        type: string
      digest_a:
        description: Approved inner ZIP SHA-256 A
        required: true
        type: string
      source_b:
        description: Successful source run for distinct release B
        required: true
        type: string
      revision_b:
        description: Exact tested commit B
        required: true
        type: string
      digest_b:
        description: Approved inner ZIP SHA-256 B
        required: true
        type: string
      approval:
        description: Only after separate approval enter PRIVATE_RELEASE_REHEARSAL
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mpa-trs-ftps-private-probe
  cancel-in-progress: false
jobs:
  rehearse:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'PRIVATE_RELEASE_REHEARSAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/deployment -v
      - name: Fetch two exact successful artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_A: ${{ inputs.source_a }}
          REVISION_A: ${{ inputs.revision_a }}
          DIGEST_A: ${{ inputs.digest_a }}
          SOURCE_B: ${{ inputs.source_b }}
          REVISION_B: ${{ inputs.revision_b }}
          DIGEST_B: ${{ inputs.digest_b }}
        run: |
          python3 scripts/deployment/fetch_application_artifact.py --run "$SOURCE_A" --revision "$REVISION_A" --digest "$DIGEST_A" --destination incoming-a
          python3 scripts/deployment/fetch_application_artifact.py --run "$SOURCE_B" --revision "$REVISION_B" --digest "$DIGEST_B" --destination incoming-b
      - name: Approved private file upload and marker replacement only
        env:
          MPA_TRS_FTPS_PROBE_USER: ${{ secrets.MPA_TRS_FTPS_PROBE_USER }}
          MPA_TRS_FTPS_PROBE_PASSWORD: ${{ secrets.MPA_TRS_FTPS_PROBE_PASSWORD }}
          SOURCE_A: ${{ inputs.source_a }}
          REVISION_A: ${{ inputs.revision_a }}
          DIGEST_A: ${{ inputs.digest_a }}
          SOURCE_B: ${{ inputs.source_b }}
          REVISION_B: ${{ inputs.revision_b }}
          DIGEST_B: ${{ inputs.digest_b }}
        run: |
          python3 scripts/deployment/ftps_release_rehearsal.py --archive-a "incoming-a/application-$REVISION_A.zip" --revision-a "$REVISION_A" --digest-a "$DIGEST_A" --source-a "$SOURCE_A" --archive-b "incoming-b/application-$REVISION_B.zip" --revision-b "$REVISION_B" --digest-b "$DIGEST_B" --source-b "$SOURCE_B" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --report evidence/private-release-rehearsal.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: private-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/private-release-rehearsal.json
          retention-days: 14
