name: FTPS private artifact probe (manual, no activation)
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful same-repository application CI/package run ID
        required: true
        type: string
      revision:
        description: Exact 40-character tested source commit
        required: true
        type: string
      release_sha256:
        description: Approved INNER application ZIP SHA-256
        required: true
        type: string
      approval:
        description: After approval of account and private transfer, enter PRIVATE_PROBE_ONLY
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mpa-trs-ftps-private-probe
  cancel-in-progress: false
jobs:
  private-probe:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'PRIVATE_PROBE_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify transport tooling
        run: python3 -m unittest discover -s tests/deployment -v
      - name: Fetch and verify the exact successful artifact, without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REVISION: ${{ inputs.revision }}
          RELEASE_DIGEST: ${{ inputs.release_sha256 }}
        run: |
          python3 scripts/deployment/fetch_application_artifact.py --run "$SOURCE_RUN" --revision "$REVISION" --digest "$RELEASE_DIGEST" --destination incoming
      - name: Approved private FTPS upload and protected roundtrip only
        env:
          MPA_TRS_FTPS_PROBE_USER: ${{ secrets.MPA_TRS_FTPS_PROBE_USER }}
          MPA_TRS_FTPS_PROBE_PASSWORD: ${{ secrets.MPA_TRS_FTPS_PROBE_PASSWORD }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REVISION: ${{ inputs.revision }}
          RELEASE_DIGEST: ${{ inputs.release_sha256 }}
        run: |
          python3 scripts/deployment/ftps_transport.py private-probe --archive "incoming/application-$REVISION.zip" --revision "$REVISION" --digest "$RELEASE_DIGEST" --source-run "$SOURCE_RUN" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --report evidence/ftps-probe.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ftps-private-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/ftps-probe.json
          retention-days: 14
          if-no-files-found: warn
