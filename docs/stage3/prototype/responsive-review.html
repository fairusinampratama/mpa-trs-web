<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Tursina — Pemeriksaan viewport mobile</title>
  <style>
    body { margin: 0; background: #e8eae5; color: #20372e; font: 16px 'Segoe UI', Arial, sans-serif; }
    header { padding: 20px; background: #fffef9; border-bottom: 1px solid #d6ddd2; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; margin: 0; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
    button, a { min-height: 44px; border: 1px solid #d6ddd2; border-radius: 4px; background: #fffef9; padding: 0 16px; display: inline-flex; align-items: center; color: #20372e; font: inherit; }
    button { cursor: pointer; }
    button[aria-pressed=true] { background: #234838; color: #fffef9; }
    main { padding: 24px; overflow: auto; }
    iframe { display: block; width: 390px; height: 844px; border: 0; background: #f5f3ec; margin: 0 auto; box-shadow: 0 4px 24px #20372e22; }
    :focus-visible { outline: 3px solid #325e70; outline-offset: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Pemeriksaan viewport · Tursina prototype</h1>
    <p>Dokumen di dalam frame memiliki viewport tersendiri. Ini menguji reflow CSS, bukan emulasi perangkat sentuh.</p>
    <nav aria-label="Pilihan lebar viewport">
      <button type="button" data-width="320" aria-pressed="false">320px</button>
      <button type="button" data-width="390" aria-pressed="true">390px</button>
      <button type="button" data-width="768" aria-pressed="false">768px</button>
      <button type="button" data-width="1024" aria-pressed="false">1024px</button>
      <button type="button" data-width="1366" aria-pressed="false">1366px</button>
      <label>Halaman <select id="review-page"><option value="./#/">Website</option><option value="./#/program/te">Tursina Explore</option><option value="./#/expedition/te11">TE11 / Bukit Raya</option><option value="./#/expedition/te12">TE12 / Trunyan</option><option value="./#/publication/sacred-gatekeeper">Artikel TE11</option><option value="./#/program/pd">Pemantapan Divisi</option><option value="./#/activity/gh29">PD Gunung Hutan XXIX</option><option value="./#/activity/rc29">PD Panjat Tebing XXIX</option><option value="./#/activity/lh29">PD Lingkungan Hidup XXIX</option><option value="./#/activities">Kegiatan lainnya</option><option value="./#/activity/batafia30">BATAFIA XXX</option><option value="./#/activity/kawi29">Gunung Kawi XXIX</option><option value="./#/ui-lab">UI laboratory</option><option value="./#/publications">Publications</option><option value="./#/knowledge">Knowledge</option><option value="./#/publication/design-school">Learning resource</option><option value="./#/publication/summit-without-carbon-debt">Restricted article</option><option value="./#/publication/te11-documentary-reference">Documentary source context</option><option value="./#/about">Tentang</option><option value="./#/jejak">Jejak</option><option value="./#/members">Buku Induk</option></select></label>
      <a href="./#/">Kembali ke desktop</a>
    </nav>
  </header>
  <main><iframe id="review-frame" title="Tursina prototype — viewport mobile" src="about:blank"></iframe></main>
  <script>
    const frame = document.getElementById('review-frame');
    function openPreview(value) {
      const target = new URL(value, location.href);
      target.searchParams.set('review', Date.now().toString());
      frame.src = target.href;
    }
    openPreview('./#/');
    document.getElementById('review-page').addEventListener('change', event => { openPreview(event.target.value); });
    document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
      frame.style.width = button.dataset.width + 'px';
      document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
  </script>
</body>
</html>
