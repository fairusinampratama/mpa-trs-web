<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="06-simple-admin-public"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">D / Small independent activity - a short form</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Synthetic one-day event. Source comparison: environmental actions in S22 can be described without an expedition hierarchy or elaborate stage editor.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">06</text><rect x="32" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="32" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="50" y="150" font-size="14" font-weight="700" fill="#ffffff">ADMIN / Quick activity</text><text x="50" y="189" font-size="11" font-weight="400" fill="#52605a">Kegiatan mandiri | No programme, edition or cohort required</text><text x="52" y="223" font-size="10" font-weight="700" fill="#52605a">Title</text><rect x="52" y="231" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="250" font-size="11" font-weight="400" fill="#20362d">Short activity title</text><text x="52" y="294" font-size="10" font-weight="700" fill="#52605a">Public summary</text><rect x="52" y="302" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="321" font-size="11" font-weight="400" fill="#20362d">What happened and why it matters</text><text x="52" y="365" font-size="10" font-weight="700" fill="#52605a">Date / place</text><rect x="52" y="373" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="392" font-size="11" font-weight="400" fill="#20362d">Known precision; unknown permitted for archive import</text><text x="52" y="436" font-size="10" font-weight="700" fill="#52605a">Source / public claim</text><rect x="52" y="444" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="463" font-size="11" font-weight="400" fill="#20362d">Reference and safe editorial summary</text><rect x="52" y="497" width="474" height="95" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="519" font-size="12" font-weight="700" fill="#20362d">+ Add details (optional)</text><text x="64" y="540" font-size="11" font-weight="400" fill="#20362d">Narrative, phase, documented result, approved image or related work. No empty</text><text x="64" y="555.95" font-size="11" font-weight="400" fill="#20362d">fields required.</text><rect x="52" y="680" width="112" height="34" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="62" y="700" font-size="11" font-weight="700" fill="#ffffff">Simpan draf</text><rect x="174" y="680" width="142" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="184" y="700" font-size="11" font-weight="400" fill="#20362d">Pratinjau publik</text><rect x="326" y="680" width="200" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="336" y="700" font-size="11" font-weight="700" fill="#20362d">Ajukan tinjauan</text><rect x="574" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="574" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="592" y="150" font-size="14" font-weight="700" fill="#ffffff">PUBLIC / Compact activity</text><text x="592" y="189" font-size="11" font-weight="400" fill="#52605a">Kegiatan &gt; Activity title</text><text x="594" y="238" font-size="25" font-weight="700" fill="#20362d">Activity title</text><text x="594" y="267" font-size="12" font-weight="400" fill="#52605a">Known date / place</text><text x="594" y="309" font-size="15" font-weight="400" fill="#20362d">A short, supported account explains the event. The page does</text><text x="594" y="330.75" font-size="15" font-weight="400" fill="#20362d">not pretend it has an expedition journey, research findings or</text><text x="594" y="352.5" font-size="15" font-weight="400" fill="#20362d">a large gallery.</text><rect x="594" y="383.25" width="474" height="88" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="405.25" font-size="12" font-weight="700" fill="#20362d">Optional documented result</text><text x="606" y="426.25" font-size="11" font-weight="400" fill="#20362d">Appears only when an actual result is evidenced; otherwise the account remains</text><text x="606" y="442.2" font-size="11" font-weight="400" fill="#20362d">sufficient.</text><rect x="594" y="481.25" width="474" height="81" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="503.25" font-size="12" font-weight="700" fill="#20362d">Continue exploring</text><text x="606" y="524.25" font-size="11" font-weight="400" fill="#20362d">Related activity or work if relevant; return to the general activities catalogue.</text><text x="594" y="600.25" font-size="12" font-weight="700" fill="#244c67">Source disclosure remains available. Missing media produces no</text><text x="594" y="617.65" font-size="12" font-weight="700" fill="#244c67">large empty panel. Saving a draft never publishes it.</text></svg>