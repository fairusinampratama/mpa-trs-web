<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="04-pd-cycle-admin-public"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">C / PD XXX - shared cycle, distinct executions</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Synthetic scenario. S23/S24/S25 explicitly group PD by cycle/cohort while executions have different dates, places and reporting depth.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">04</text><rect x="32" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="32" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="50" y="150" font-size="14" font-weight="700" fill="#ffffff">ADMIN / Cycle workspace</text><text x="50" y="189" font-size="11" font-weight="400" fill="#52605a">Programme: Pemantapan Divisi &gt; CycleXXX | New sourced parent proposal</text><text x="52" y="223" font-size="10" font-weight="700" fill="#52605a">Shared purpose / cohort context</text><rect x="52" y="231" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="250" font-size="11" font-weight="400" fill="#20362d">Enter once; cohort association is optional outside PD</text><text x="52" y="294" font-size="10" font-weight="700" fill="#52605a">Applicable preparation context</text><rect x="52" y="302" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="321" font-size="11" font-weight="400" fill="#20362d">Learning / proposal / simulation, as documented</text><rect x="52" y="355" width="474" height="87" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="377" font-size="12" font-weight="700" fill="#20362d">Pelaksanaan divisi</text><text x="64" y="398" font-size="11" font-weight="400" fill="#20362d">GH: add / RC: add / ORAD: add / LH: add / Caving: add. Prompts are not</text><text x="64" y="413.95" font-size="11" font-weight="400" fill="#20362d">completed activity records.</text><rect x="52" y="452" width="474" height="86" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="474" font-size="12" font-weight="700" fill="#20362d">Open a division execution</text><text x="64" y="495" font-size="11" font-weight="400" fill="#20362d">Each child has its own evidence, date, place and publication state. Shared</text><text x="64" y="510.95" font-size="11" font-weight="400" fill="#20362d">context appears as a linked value.</text><rect x="52" y="548" width="474" height="82" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="570" font-size="12" font-weight="700" fill="#20362d">Review impact</text><text x="64" y="591" font-size="11" font-weight="400" fill="#20362d">Common correction previews dependent views. Budget or preparation alone</text><text x="64" y="606.95" font-size="11" font-weight="400" fill="#20362d">never creates an executed division.</text><rect x="52" y="680" width="112" height="34" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="62" y="700" font-size="11" font-weight="700" fill="#ffffff">Simpan draf</text><rect x="174" y="680" width="142" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="184" y="700" font-size="11" font-weight="400" fill="#20362d">Pratinjau publik</text><rect x="326" y="680" width="200" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="336" y="700" font-size="11" font-weight="700" fill="#20362d">Ajukan tinjauan</text><rect x="574" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="574" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="592" y="150" font-size="14" font-weight="700" fill="#ffffff">PUBLIC / Cycle overview</text><text x="592" y="189" font-size="11" font-weight="400" fill="#52605a">Pemantapan Divisi &gt; CycleXXX | Not a member roster</text><text x="594" y="236" font-size="23" font-weight="700" fill="#20362d">Pemantapan Divisi XXX</text><text x="594" y="263" font-size="13" font-weight="400" fill="#20362d">Educational purpose and shared context. No single execution date is</text><text x="594" y="281.85" font-size="13" font-weight="400" fill="#20362d">invented for all divisions.</text><rect x="594" y="306" width="474" height="78" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="328" font-size="12" font-weight="700" fill="#20362d">Context / applicable preparation</text><text x="606" y="349" font-size="11" font-weight="400" fill="#20362d">Short sourced account; no claim that every team attended one joint session</text><text x="606" y="364.95" font-size="11" font-weight="400" fill="#20362d">unless documented.</text><rect x="594" y="394" width="474" height="55" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="608" y="414" font-size="12" font-weight="700" fill="#20362d">Gunung Hutan</text><text x="608" y="434" font-size="11" font-weight="400" fill="#52605a">Own date / place</text><rect x="594" y="459" width="474" height="55" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="608" y="479" font-size="12" font-weight="700" fill="#20362d">Panjat Tebing</text><text x="608" y="499" font-size="11" font-weight="400" fill="#52605a">Different date / place</text><rect x="594" y="524" width="474" height="55" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="608" y="544" font-size="12" font-weight="700" fill="#20362d">ORAD / LH / Caving</text><text x="608" y="564" font-size="11" font-weight="400" fill="#52605a">Only approved executions appear</text><text x="594" y="608" font-size="11" font-weight="700" fill="#244c67">Coverage can remain incomplete. PD26 spans 2023-2024; LH26 and</text><text x="594" y="623.95" font-size="11" font-weight="700" fill="#244c67">Caving28 must not be fabricated from empty slots.</text></svg>