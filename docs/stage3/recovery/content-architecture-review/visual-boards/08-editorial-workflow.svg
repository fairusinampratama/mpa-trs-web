<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="08-editorial-workflow"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">Editorial review is separate from event execution</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Proposal grounded in OD06 centralized editing. Organizers can submit through the existing simple institutional channel without CMS accounts.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">08</text><rect x="32" y="143" width="198" height="115" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="44" y="173" font-size="15" font-weight="700" fill="#20362d">Draft</text><text x="44" y="203" font-size="12" font-weight="400" fill="#20362d">Editor saves working</text><text x="44" y="220.4" font-size="12" font-weight="400" fill="#20362d">revision.</text><rect x="246" y="143" width="198" height="115" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="258" y="173" font-size="15" font-weight="700" fill="#20362d">Submitted</text><text x="258" y="203" font-size="12" font-weight="400" fill="#20362d">Evidence and public preview</text><text x="258" y="220.4" font-size="12" font-weight="400" fill="#20362d">ready.</text><rect x="460" y="143" width="198" height="115" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="472" y="173" font-size="15" font-weight="700" fill="#20362d">In review</text><text x="472" y="203" font-size="12" font-weight="400" fill="#20362d">Facts, sensitivity, conflicts</text><text x="472" y="220.4" font-size="12" font-weight="400" fill="#20362d">checked.</text><rect x="674" y="143" width="198" height="115" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="686" y="173" font-size="15" font-weight="700" fill="#20362d">Approved</text><text x="686" y="203" font-size="12" font-weight="400" fill="#20362d">Exact revision approved.</text><rect x="888" y="143" width="198" height="115" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="900" y="173" font-size="15" font-weight="700" fill="#20362d">Published</text><text x="900" y="203" font-size="12" font-weight="400" fill="#20362d">Publisher releases safe</text><text x="900" y="220.4" font-size="12" font-weight="400" fill="#20362d">snapshot.</text><rect x="32" y="291" width="332" height="268" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="48" y="325" font-size="16" font-weight="700" fill="#20362d">Corrections / revisions</text><text x="48" y="360" font-size="12" font-weight="400" fill="#20362d">- Live snapshot stays while changes are</text><text x="48" y="377.4" font-size="12" font-weight="400" fill="#20362d">reviewed.</text><text x="48" y="411.79999999999995" font-size="12" font-weight="400" fill="#20362d">- Material changes invalidate approval for that</text><text x="48" y="429.19999999999993" font-size="12" font-weight="400" fill="#20362d">revision.</text><text x="48" y="463.5999999999999" font-size="12" font-weight="400" fill="#20362d">- Record source version, editor, reason and</text><text x="48" y="480.9999999999999" font-size="12" font-weight="400" fill="#20362d">affected views.</text><rect x="394" y="291" width="332" height="268" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="410" y="325" font-size="16" font-weight="700" fill="#20362d">Rights / original availability</text><text x="410" y="360" font-size="12" font-weight="400" fill="#20362d">- Private report is not a public attachment.</text><text x="410" y="394.4" font-size="12" font-weight="400" fill="#20362d">- HOLD photo omitted from preview, not guessed</text><text x="410" y="411.79999999999995" font-size="12" font-weight="400" fill="#20362d">cleared.</text><text x="410" y="446.19999999999993" font-size="12" font-weight="400" fill="#20362d">- Withdraw one contextual use without erasing</text><text x="410" y="463.5999999999999" font-size="12" font-weight="400" fill="#20362d">other approved uses.</text><rect x="756" y="291" width="332" height="268" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="772" y="325" font-size="16" font-weight="700" fill="#20362d">Volunteer-friendly operations</text><text x="772" y="360" font-size="12" font-weight="400" fill="#20362d">- One designated person may cover several</text><text x="772" y="377.4" font-size="12" font-weight="400" fill="#20362d">permissions.</text><text x="772" y="411.79999999999995" font-size="12" font-weight="400" fill="#20362d">- No compulsory extra committee or signatures.</text><text x="772" y="446.19999999999993" font-size="12" font-weight="400" fill="#20362d">- Duplicate merge and parent withdrawal show</text><text x="772" y="463.5999999999999" font-size="12" font-weight="400" fill="#20362d">an impact preview.</text><rect x="32" y="594" width="1056" height="115" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="48" y="625" font-size="16" font-weight="700" fill="#20362d">Fields the public must never inherit automatically</text><text x="48" y="658" font-size="13" font-weight="400" fill="#20362d">Execution from a planned date; achievement from a standard; manuscript permission from metadata approval; image permission from a related-record</text><text x="48" y="676.85" font-size="13" font-weight="400" fill="#20362d">link; a completed division from a budget; personal progression from an activity record.</text></svg>