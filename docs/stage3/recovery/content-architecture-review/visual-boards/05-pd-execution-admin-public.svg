<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="05-pd-execution-admin-public"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">C / Division detail - standards are not results</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Real source example: GH XXVI. This is a proposed presentation, not publication of a new technical article or source illustrations.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">05</text><rect x="32" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="32" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="50" y="150" font-size="14" font-weight="700" fill="#ffffff">ADMIN / GH XXVI execution</text><text x="50" y="189" font-size="11" font-weight="400" fill="#52605a">PD cycleXXVI &gt; Existing ID gh26 | Preserve its current canonical URL</text><text x="52" y="223" font-size="10" font-weight="700" fill="#52605a">Inherited context</text><rect x="52" y="231" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="250" font-size="11" font-weight="400" fill="#20362d">PDXXVI purpose / cohort; sourced parent reference</text><text x="52" y="294" font-size="10" font-weight="700" fill="#52605a">Own execution date / place</text><rect x="52" y="302" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="321" font-size="11" font-weight="400" fill="#20362d">19-26 Aug2023 / Gunung Slamet [SGH4.1-4.2]</text><rect x="52" y="355" width="474" height="87" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="377" font-size="12" font-weight="700" fill="#20362d">Documented preparation phases</text><text x="64" y="398" font-size="11" font-weight="400" fill="#20362d">Simulation I:19-21Jul2023; II:2-5Aug2023. Separate dates and locations, not</text><text x="64" y="413.95" font-size="11" font-weight="400" fill="#20362d">competing overall-date assertions.</text><rect x="52" y="452" width="474" height="85" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="474" font-size="12" font-weight="700" fill="#20362d">Learning standard vs application</text><text x="64" y="495" font-size="11" font-weight="400" fill="#20362d">Keep the intended standard. Add actual navigation account with SGH4.7.2</text><text x="64" y="510.95" font-size="11" font-weight="400" fill="#20362d">evidence; do not auto-check achievement.</text><rect x="52" y="547" width="474" height="82" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="569" font-size="12" font-weight="700" fill="#20362d">Reusable theory resource candidate</text><text x="64" y="590" font-size="11" font-weight="400" fill="#20362d">General theory is edited as a separate work when justified. Rights/technical</text><text x="64" y="605.95" font-size="11" font-weight="400" fill="#20362d">review is required before reproduction.</text><rect x="52" y="680" width="112" height="34" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="62" y="700" font-size="11" font-weight="700" fill="#ffffff">Simpan draf</text><rect x="174" y="680" width="142" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="184" y="700" font-size="11" font-weight="400" fill="#20362d">Pratinjau publik</text><rect x="326" y="680" width="200" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="336" y="700" font-size="11" font-weight="700" fill="#20362d">Ajukan tinjauan</text><rect x="574" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="574" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="592" y="150" font-size="14" font-weight="700" fill="#ffffff">PUBLIC / One divisional execution</text><text x="592" y="189" font-size="11" font-weight="400" fill="#52605a">PD &gt; XXVI &gt; Gunung Hutan | Own metadata and field account</text><text x="594" y="238" font-size="25" font-weight="700" fill="#20362d">Gunung Hutan XXVI</text><text x="594" y="266" font-size="13" font-weight="400" fill="#20362d">Gunung Slamet / 19-26 August2023. A concise field account comes</text><text x="594" y="284.85" font-size="13" font-weight="400" fill="#20362d">before archival methodology.</text><rect x="594" y="307" width="474" height="80" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="329" font-size="12" font-weight="700" fill="#20362d">Simulations and field implementation</text><text x="606" y="350" font-size="11" font-weight="400" fill="#20362d">Actual preparatory phases may be summarized; a full minute-by-minute private</text><text x="606" y="365.95" font-size="11" font-weight="400" fill="#20362d">rundown is unnecessary.</text><rect x="594" y="397" width="474" height="91" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="419" font-size="12" font-weight="700" fill="#20362d">Application in the field</text><text x="606" y="440" font-size="11" font-weight="400" fill="#20362d">Source describes manual/digital navigation and resection records. Attribute the</text><text x="606" y="455.95" font-size="11" font-weight="400" fill="#20362d">account; do not imply certification.</text><rect x="594" y="498" width="474" height="88" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="520" font-size="12" font-weight="700" fill="#20362d">Learning resources and documentary media</text><text x="606" y="541" font-size="11" font-weight="400" fill="#20362d">Independent resource link only when approved/available. This review grants no</text><text x="606" y="556.95" font-size="11" font-weight="400" fill="#20362d">new photo placement.</text><text x="594" y="615" font-size="11" font-weight="400" fill="#52605a">Technical botanical/safety claims need subject review. A theory chapter is neither an</text><text x="594" y="630.95" font-size="11" font-weight="400" fill="#52605a">achieved outcome nor an automatically public resource.</text></svg>