<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="03-te-admin-public"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">B / Tursina Explore #13 - editable documentary journey</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Synthetic authoring scenario. Reuses the rich TE11 pattern without requiring TE10 or TE12 to have equally complete evidence.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">03</text><rect x="32" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="32" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="50" y="150" font-size="14" font-weight="700" fill="#ffffff">ADMIN / Expedition occurrence</text><text x="50" y="189" font-size="11" font-weight="400" fill="#52605a">Programme: TE &gt; Edition13 | One activity identity, one working revision</text><text x="52" y="223" font-size="10" font-weight="700" fill="#52605a">Identity and objectives</text><rect x="52" y="231" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="250" font-size="11" font-weight="400" fill="#20362d">Edition13 / objectives are intentions, not achievements</text><text x="52" y="294" font-size="10" font-weight="700" fill="#52605a">Dates and places</text><rect x="52" y="302" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="321" font-size="11" font-weight="400" fill="#20362d">Planned destination + actual assertions when known</text><rect x="52" y="355" width="474" height="78" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="377" font-size="12" font-weight="700" fill="#20362d">Preparation / public-safe summary</text><text x="64" y="398" font-size="11" font-weight="400" fill="#20362d">Optional account; attach evidence. Operational contacts, health notes and</text><text x="64" y="413.95" font-size="11" font-weight="400" fill="#20362d">finances remain private.</text><rect x="52" y="443" width="474" height="92" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="465" font-size="12" font-weight="700" fill="#20362d">Journey  [+ Add stage]</text><text x="64" y="486" font-size="11" font-weight="400" fill="#20362d">Local stage ID; title; order; optional actual date/place; narrative; sources. Move</text><text x="64" y="501.95" font-size="11" font-weight="400" fill="#20362d">up/down preserves identity.</text><rect x="52" y="545" width="474" height="90" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="567" font-size="12" font-weight="700" fill="#20362d">Observations and independent works</text><text x="64" y="588" font-size="11" font-weight="400" fill="#20362d">Separate reported findings from planned outputs. Pick existing work; specify</text><text x="64" y="603.95" font-size="11" font-weight="400" fill="#20362d">documents / discusses / produced from.</text><rect x="52" y="680" width="112" height="34" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="62" y="700" font-size="11" font-weight="700" fill="#ffffff">Simpan draf</text><rect x="174" y="680" width="142" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="184" y="700" font-size="11" font-weight="400" fill="#20362d">Pratinjau publik</text><rect x="326" y="680" width="200" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="336" y="700" font-size="11" font-weight="700" fill="#20362d">Ajukan tinjauan</text><rect x="574" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="574" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="592" y="150" font-size="14" font-weight="700" fill="#ffffff">PUBLIC / Rich expedition</text><text x="592" y="189" font-size="11" font-weight="400" fill="#52605a">Tursina Explore &gt; Edition13 | Metadata and literal institutional context</text><text x="594" y="238" font-size="25" font-weight="700" fill="#20362d">Expedition title</text><text x="594" y="265" font-size="13" font-weight="400" fill="#20362d">A clear account of purpose and place; actual dates retain precision and</text><text x="594" y="283.85" font-size="13" font-weight="400" fill="#20362d">any material source disagreement.</text><rect x="594" y="308" width="474" height="75" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="330" font-size="12" font-weight="700" fill="#20362d">Purpose and preparation</text><text x="606" y="351" font-size="11" font-weight="400" fill="#20362d">Concise account. Not an internal job-description table or fundraising ledger.</text><rect x="594" y="393" width="474" height="100" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="415" font-size="12" font-weight="700" fill="#20362d">Documentary journey</text><text x="606" y="436" font-size="11" font-weight="400" fill="#20362d">Stage1 -&gt; Stage2 -&gt; Stage3. Different places/dates; media only in approved</text><text x="606" y="451.95" font-size="11" font-weight="400" fill="#20362d">contexts. No live tracking implied.</text><rect x="594" y="503" width="474" height="85" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="525" font-size="12" font-weight="700" fill="#20362d">Observations / related works</text><text x="606" y="546" font-size="11" font-weight="400" fill="#20362d">Only evidenced observations; independent article/resource links with truthful</text><text x="606" y="561.95" font-size="11" font-weight="400" fill="#20362d">availability actions.</text><text x="594" y="618" font-size="12" font-weight="700" fill="#244c67">Sparse edition: omit absent journey/findings rather than showing</text><text x="594" y="635.4" font-size="12" font-weight="700" fill="#244c67">empty chapters or fabricating results.</text></svg>