<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="07-archive-admin-public"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">E / Historical import - truthful partial content</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Real structural examples: sparse TE12, conflicting BATAFIA28 wording and disputed TE11 dates. No fictional historical detail is introduced.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">07</text><rect x="32" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="32" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="50" y="150" font-size="14" font-weight="700" fill="#ffffff">ADMIN / Compare evidence before publish</text><text x="50" y="189" font-size="11" font-weight="400" fill="#52605a">Search existing IDs first | Historical import | One record, several assertions</text><text x="52" y="223" font-size="10" font-weight="700" fill="#52605a">Canonical identity</text><rect x="52" y="231" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="250" font-size="11" font-weight="400" fill="#20362d">Choose existing record or create after duplicate review</text><text x="52" y="294" font-size="10" font-weight="700" fill="#52605a">Date precision / source assertion</text><rect x="52" y="302" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="321" font-size="11" font-weight="400" fill="#20362d">Exact / range / month / year / approximate / unknown</text><rect x="52" y="355" width="474" height="91" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="377" font-size="12" font-weight="700" fill="#20362d">Conflict comparison</text><text x="64" y="398" font-size="11" font-weight="400" fill="#20362d">Keep both assertions and source versions. Select a public label with reason;</text><text x="64" y="413.95" font-size="11" font-weight="400" fill="#20362d">retain unresolved status where necessary.</text><rect x="52" y="456" width="474" height="82" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="478" font-size="12" font-weight="700" fill="#20362d">Public projection depth</text><text x="64" y="499" font-size="11" font-weight="400" fill="#20362d">Metadata + short summary only. No compulsory results, manuscript, photo,</text><text x="64" y="514.95" font-size="11" font-weight="400" fill="#20362d">session or chronology.</text><rect x="52" y="548" width="474" height="82" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="570" font-size="12" font-weight="700" fill="#20362d">Review checklist</text><text x="64" y="591" font-size="11" font-weight="400" fill="#20362d">Evidence supports identity; sensitive originals excluded; no unsupported current</text><text x="64" y="606.95" font-size="11" font-weight="400" fill="#20362d">claim; missing fields honestly disclosed.</text><rect x="52" y="680" width="112" height="34" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="62" y="700" font-size="11" font-weight="700" fill="#ffffff">Simpan draf</text><rect x="174" y="680" width="142" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="184" y="700" font-size="11" font-weight="400" fill="#20362d">Pratinjau publik</text><rect x="326" y="680" width="200" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="336" y="700" font-size="11" font-weight="700" fill="#20362d">Ajukan tinjauan</text><rect x="574" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="574" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="592" y="150" font-size="14" font-weight="700" fill="#ffffff">PUBLIC / Sparse archive record</text><text x="592" y="189" font-size="11" font-weight="400" fill="#52605a">Programme or activities catalogue &gt; Existing record</text><text x="594" y="238" font-size="25" font-weight="700" fill="#20362d">Tursina Explore #12</text><text x="594" y="268" font-size="12" font-weight="400" fill="#52605a">26 Sep-5 Oct2025 / Trunyan</text><text x="594" y="311" font-size="15" font-weight="400" fill="#20362d">Cultural exploration is documented. The available</text><text x="594" y="332.75" font-size="15" font-weight="400" fill="#20362d">management entry does not establish a full journey or</text><text x="594" y="354.5" font-size="15" font-weight="400" fill="#20362d">detailed results.</text><rect x="594" y="386.25" width="474" height="86" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="408.25" font-size="12" font-weight="700" fill="#20362d">What is available</text><text x="606" y="429.25" font-size="11" font-weight="400" fill="#20362d">Identity, recorded time/place and limited context. No fake article body or</text><text x="606" y="445.2" font-size="11" font-weight="400" fill="#20362d">downloadable original.</text><rect x="594" y="482.25" width="474" height="92" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="504.25" font-size="12" font-weight="700" fill="#20362d">Sources and gaps</text><text x="606" y="525.25" font-size="11" font-weight="400" fill="#20362d">Detailed records can be added to the same ID after review. A source</text><text x="606" y="541.2" font-size="11" font-weight="400" fill="#20362d">contradiction stays scoped and discoverable.</text><text x="594" y="614.25" font-size="12" font-weight="700" fill="#244c67">Unknown dates use an explicit label and separate grouping. No</text><text x="594" y="631.65" font-size="12" font-weight="700" fill="#244c67">fabricated January1 or automatic annual timeline.</text></svg>