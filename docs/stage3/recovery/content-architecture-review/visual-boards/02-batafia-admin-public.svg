<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="02-batafia-admin-public"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">A / BATAFIA XXXI - basic-education edition</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Synthetic authoring scenario. Source pattern: BATAFIA27-30 reports distinguish forum and field implementation; detailed future session content is deliberately unspecified.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">02</text><rect x="32" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="32" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="50" y="150" font-size="14" font-weight="700" fill="#ffffff">ADMIN / One occurrence, optional phases</text><text x="50" y="189" font-size="11" font-weight="400" fill="#52605a">Programme: BATAFIA &gt; New edition | Draft r1 | Synthetic scenario</text><text x="52" y="223" font-size="10" font-weight="700" fill="#52605a">Edition / public identity</text><rect x="52" y="231" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="250" font-size="11" font-weight="400" fill="#20362d">XXXI / BATAFIA XXXI</text><text x="52" y="294" font-size="10" font-weight="700" fill="#52605a">Purpose / summary</text><rect x="52" y="302" width="474" height="39" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="63" y="321" font-size="11" font-weight="400" fill="#20362d">Basic education - enter the approved edition brief.</text><rect x="52" y="355" width="474" height="93" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="377" font-size="12" font-weight="700" fill="#20362d">Forum  /  planned | actual | unknown</text><text x="64" y="398" font-size="11" font-weight="400" fill="#20362d">+ Add session: title, topic, optional date/place, source. Move up/down. Keep</text><text x="64" y="413.95" font-size="11" font-weight="400" fill="#20362d">incomplete sessions incomplete.</text><rect x="52" y="458" width="474" height="89" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="480" font-size="12" font-weight="700" fill="#20362d">Field training  /  own date and place</text><text x="64" y="501" font-size="11" font-weight="400" fill="#20362d">Add field stages only when known. Record implementation separately from</text><text x="64" y="516.95" font-size="11" font-weight="400" fill="#20362d">objectives. No personal pass/fail roster.</text><rect x="52" y="557" width="474" height="80" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="64" y="579" font-size="12" font-weight="700" fill="#20362d">Results, works and media</text><text x="64" y="600" font-size="11" font-weight="400" fill="#20362d">Link independently reviewed works. Choose exact approved media use. HOLD</text><text x="64" y="615.95" font-size="11" font-weight="400" fill="#20362d">assets excluded from public preview.</text><rect x="52" y="680" width="112" height="34" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="62" y="700" font-size="11" font-weight="700" fill="#ffffff">Simpan draf</text><rect x="174" y="680" width="142" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="184" y="700" font-size="11" font-weight="400" fill="#20362d">Pratinjau publik</text><rect x="326" y="680" width="200" height="34" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="336" y="700" font-size="11" font-weight="700" fill="#20362d">Ajukan tinjauan</text><rect x="574" y="125" width="514" height="605" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><rect x="574" y="125" width="514" height="42" fill="#214a39" stroke="#214a39" stroke-width=".7"/><text x="592" y="150" font-size="14" font-weight="700" fill="#ffffff">PUBLIC / BATAFIA edition</text><text x="592" y="189" font-size="11" font-weight="400" fill="#52605a">MAPALA Tursina &gt; Kegiatan &gt; BATAFIA &gt; XXXI</text><text x="594" y="238" font-size="25" font-weight="700" fill="#20362d">BATAFIA XXXI</text><text x="594" y="264" font-size="13" font-weight="400" fill="#20362d">What this edition is for. Summary approved independently of any</text><text x="594" y="282.85" font-size="13" font-weight="400" fill="#20362d">original LPJ.</text><rect x="594" y="306" width="474" height="91" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="328" font-size="12" font-weight="700" fill="#20362d">Forum</text><text x="606" y="349" font-size="11" font-weight="400" fill="#20362d">Known dates/place. Session list appears only when documented; optional topics,</text><text x="606" y="364.95" font-size="11" font-weight="400" fill="#20362d">not an invented syllabus.</text><rect x="594" y="407" width="474" height="91" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="429" font-size="12" font-weight="700" fill="#20362d">Pendidikan lapangan</text><text x="606" y="450" font-size="11" font-weight="400" fill="#20362d">Independent dates/place and concise implementation account. Incomplete forum</text><text x="606" y="465.95" font-size="11" font-weight="400" fill="#20362d">metadata does not erase this phase.</text><rect x="594" y="508" width="474" height="90" fill="#eef1eb" stroke="#c6cdc6" stroke-width=".7"/><text x="606" y="530" font-size="12" font-weight="700" fill="#20362d">What is documented</text><text x="606" y="551" font-size="11" font-weight="400" fill="#20362d">Reported learning and results, where evidenced. Cleared photo/caption and</text><text x="606" y="566.95" font-size="11" font-weight="400" fill="#20362d">related works, if available.</text><text x="594" y="625" font-size="11" font-weight="400" fill="#52605a">Sumber &amp; catatan: a significant forum-date conflict remains local to that phase;</text><text x="594" y="640.95" font-size="11" font-weight="400" fill="#52605a">private report stays restricted.</text></svg>