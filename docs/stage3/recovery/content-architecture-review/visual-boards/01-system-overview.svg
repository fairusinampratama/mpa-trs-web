<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="01-system-overview"><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1120" height="800" fill="#f6f4ee" stroke="#f6f4ee" stroke-width=".7"/><text x="32" y="31" font-size="11" font-weight="700" fill="#214a39">MPA-TRS / CONTENT ARCHITECTURE REVIEW</text><text x="32" y="71" font-size="26" font-weight="700" fill="#20362d">One authoring system, several honest public experiences</text><text x="32" y="97" font-size="12" font-weight="400" fill="#52605a">Proposal: preserve the canonical identities and permissions; add the institutional composition that the present records do not yet express.</text><text x="32" y="773" font-size="9" font-weight="400" fill="#52605a">28 OCT 2026  |  STRUCTURAL DESIGN ONLY  |  NOT IMPLEMENTED / NOT PUBLICATION APPROVAL</text><text x="1050" y="775" font-size="11" font-weight="700" fill="#20362d">01</text><rect x="32" y="140" width="332" height="145" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="48" y="171" font-size="14" font-weight="700" fill="#20362d">1  SOURCE EVIDENCE</text><text x="48" y="202" font-size="12" font-weight="400" fill="#20362d">Restricted LPJ/report version; scoped claims.</text><text x="48" y="219.4" font-size="12" font-weight="400" fill="#20362d">Theory, plans, execution and results are not</text><text x="48" y="236.8" font-size="12" font-weight="400" fill="#20362d">interchangeable.</text><rect x="394" y="140" width="332" height="145" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="410" y="171" font-size="14" font-weight="700" fill="#20362d">2  MANAGED CONTENT</text><text x="410" y="202" font-size="12" font-weight="400" fill="#20362d">Programme + occurrence; optional child</text><text x="410" y="219.4" font-size="12" font-weight="400" fill="#20362d">executions and dated phases; independent works</text><text x="410" y="236.8" font-size="12" font-weight="400" fill="#20362d">and permitted media.</text><rect x="756" y="140" width="332" height="145" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="772" y="171" font-size="14" font-weight="700" fill="#20362d">3  APPROVED PUBLIC VIEW</text><text x="772" y="202" font-size="12" font-weight="400" fill="#20362d">Reviewed snapshot selects truthful sections, safe</text><text x="772" y="219.4" font-size="12" font-weight="400" fill="#20362d">metadata and exact authorized media contexts.</text><text x="32" y="331" font-size="18" font-weight="700" fill="#20362d">Recurring structure supported by the examined reports</text><rect x="32" y="355" width="1056" height="69" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="46" y="378" font-size="13" font-weight="700" fill="#20362d">Tursina Explore</text><text x="270" y="378" font-size="12" font-weight="700" fill="#244c67">TE10 / TE11 / TE12</text><text x="550" y="377" font-size="12" font-weight="400" fill="#20362d">One edition; optional journey and findings; sparse editions remain valid.</text><rect x="32" y="433" width="1056" height="69" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="46" y="456" font-size="13" font-weight="700" fill="#20362d">BATAFIA</text><text x="270" y="456" font-size="12" font-weight="700" fill="#244c67">XXVII / XXVIII / XXIX / XXX</text><text x="550" y="455" font-size="12" font-weight="400" fill="#20362d">Recurring basic education; forum + field dates/places; optional sessions.</text><rect x="32" y="511" width="1056" height="69" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="46" y="534" font-size="13" font-weight="700" fill="#20362d">Pemantapan Divisi</text><text x="270" y="534" font-size="12" font-weight="700" fill="#244c67">XXVI / XXVII / XXVIII / XXIX</text><text x="550" y="533" font-size="12" font-weight="400" fill="#20362d">Cycle context; distinct divisional executions, not one universal date.</text><rect x="32" y="589" width="1056" height="69" fill="#ffffff" stroke="#c6cdc6" stroke-width=".7"/><text x="46" y="612" font-size="13" font-weight="700" fill="#20362d">Other activities</text><text x="270" y="612" font-size="12" font-weight="700" fill="#244c67">Kawi / schools / environmental actions</text><text x="550" y="611" font-size="12" font-weight="400" fill="#20362d">Optional series or phases; a small independent event needs only a short form.</text><text x="32" y="697" font-size="11" font-weight="400" fill="#52605a">Source basis: S22/S23/S24/S25 management reports; STE dedicated TE11; SGH dedicated GH26. V = source statement; grouping and form choices remain recommendations.</text></svg>